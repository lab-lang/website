<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/lab-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The Lab compiler turns experiments described in Lab or Python into LAIR, one verified intermediate representation, and from LAIR into work a laboratory can run."
    />
    <meta name="theme-color" content="#f9efdd" />
    <!--
      Inline and blocking, so the stored theme is on <html> before the first
      paint. Deferring this to React costs a flash of the light page on every
      load. It restates the storage key, class name and theme-color from
      src/lib/theme.ts; the two must move together.
    -->
    <script>
      ;(function () {
        try {
          var choice = localStorage.getItem('lab-theme') || 'system'
          var dark =
            choice === 'dark' ||
            (choice === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)

          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#14100a' : '#f9efdd')
        } catch (error) {
          // An unreadable preference just leaves the page on its light default.
        }
      })()
    </script>
    <!--
      The homepage's answer, and the fallback for any crawler that does not run
      scripts. Every route rewrites these after mount through
      src/lib/use-page-meta.ts, which restates the origin and card path from
      src/lib/site.ts; the two must move together.
    -->
    <link rel="canonical" href="https://www.lab-compiler.org/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lab" />
    <meta property="og:url" content="https://www.lab-compiler.org/" />
    <meta property="og:title" content="The Lab Compiler" />
    <meta
      property="og:description"
      content="Describe the biological result you want, the constraints that must hold, and the evidence needed to accept it, without binding that intent to a particular laboratory."
    />
    <meta
      property="og:image"
      content="https://www.lab-compiler.org/og/lab.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Lab: a compiler for the robotic laboratory. Write the experiment once, in Lab or Python, and compile it for any lab."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Lab Compiler" />
    <meta
      name="twitter:description"
      content="Describe the biological result you want, the constraints that must hold, and the evidence needed to accept it, without binding that intent to a particular laboratory."
    />
    <meta
      name="twitter:image"
      content="https://www.lab-compiler.org/og/lab.png"
    />
    <title>The Lab Compiler</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
